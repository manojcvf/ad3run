<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AD3 Run</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#111111">
</head>
<body>
    <header class="app-header">
        <h1>Início</h1>
        <div class="header-icons">🔔 ≡</div>
    </header>

    <main class="app-content">
        <!-- Calendário da Semana -->
        <div class="week-calendar">
            <span>S</span> <span class="active">T</span> <span>Q</span> <span>Q</span> <span>S</span> <span>S</span> <span>D</span>
        </div>

        <!-- Card de Treino do Dia -->
        <div class="workout-card">
            <div class="card-badge">TREINO DE HOJE</div>
            <div class="workout-header">
                <span class="icon">🏃</span>
                <div class="workout-title">
                    <h2>Corrida intervalada</h2>
                    <p>Terça • Bloco AD3 Run • Prof. Cesar</p>
                </div>
            </div>
            
            <div class="workout-stats">
                <div class="stat">
                    <span class="label">Distância</span>
                    <span class="value">5 km</span>
                </div>
                <div class="stat">
                    <span class="label">Ritmo-alvo</span>
                    <span class="value">5:30/km</span>
                </div>
                <div class="stat">
                    <span class="label">Duração</span>
                    <span class="value">~40 min</span>
                </div>
            </div>

            <button class="btn-primary">Iniciar treino</button>
        </div>
    </main>

    <!-- Menu Inferior (Bottom Nav) -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active">🏠<br>Início</a>
        <a href="#" class="nav-item">🔲<br>Timeline</a>
        <a href="#" class="nav-item">📅<br>Grade</a>
        <a href="#" class="nav-item">👤<br>Perfil</a>
    </nav>

    <script src="app.js"></script>
</body>
</html>
